<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beginner Chess Strategy Advisor</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">


        <!-- HEADER -->

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    ♟
                </div>

                <div>

                    <h1 id="header-title"></h1>

                    <p id="header-status"></p>

                </div>

            </div>

        </header>


        <main>


            <!-- WELCOME -->

            <section id="welcome-screen" class="screen active">

                <div class="welcome-card">

                    <div class="large-icon">
                        ♟
                    </div>

                    <h2 id="welcome-title"></h2>

                    <p id="welcome-description"></p>

                    <button id="start-button" class="primary-button">
                    </button>

                </div>

            </section>


            <!-- QUESTIONS -->

            <section id="question-screen" class="screen">

                <div class="progress-area">

                    <div class="progress-info">

                        <span id="step-label"></span>

                        <span id="step-percentage"></span>

                    </div>


                    <div class="progress-bar">

                        <div id="progress-fill" class="progress-fill">
                        </div>

                    </div>

                </div>


                <div class="question-card">


                    <div class="question-header">

                        <div id="category-icon" class="category-icon">
                            ♟
                        </div>


                        <div>

                            <span id="question-number" class="question-number">
                            </span>

                            <p id="category-name" class="category-name">
                            </p>

                        </div>

                    </div>


                    <h2 id="question-title"></h2>


                    <p id="question-description" class="question-description">
                    </p>


                    <div id="options-container"></div>


                    <div id="followup-container" class="followup-container hidden">

                        <h3 id="followup-question"></h3>

                        <div id="followup-options"></div>

                    </div>


                    <div id="selected-answer-box" class="selected-answer-box hidden">

                        <span id="selected-answer-text">
                        </span>

                    </div>


                    <div class="navigation">

                        <button id="back-button" class="secondary-button">
                        </button>


                        <button id="continue-button" class="primary-button" disabled>
                        </button>

                    </div>

                </div>

            </section>


            <!-- ANALYZING -->

            <section id="analyzing-screen" class="screen">

                <div class="analyzing-card">

                    <div class="loader"></div>

                    <h2 id="analyzing-title"></h2>

                    <p id="analyzing-description"></p>

                </div>

            </section>


            <!-- RESULT -->

            <section id="result-screen" class="screen">

                <div class="result-card">


                    <div class="result-icon">
                        ♛
                    </div>


                    <p id="recommendation-label" class="result-label">
                    </p>


                    <h2 id="recommendation-title"></h2>


                    <p id="recommendation-description" class="result-description">
                    </p>


                    <!-- REASONING -->

                    <div class="reasoning-section">

                        <h3 id="reasoning-heading"></h3>

                        <div id="reasoning-container"></div>

                    </div>


                    <!-- SUMMARY -->

                    <div class="summary-section">

                        <h3 id="summary-heading"></h3>

                        <div id="summary-container"></div>

                    </div>


                    <!-- ACTIONS -->

                    <div class="result-actions">

                        <button id="view-answers-button" class="secondary-button">
                        </button>


                        <button id="restart-button" class="primary-button">
                        </button>

                    </div>

                </div>

            </section>

        </main>


        <footer>

            <p id="footer-text"></p>

        </footer>


    </div>


    <script src="script.js"></script>

</body>

</html>
